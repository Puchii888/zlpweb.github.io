<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见文本标签</title>
</head>
<body>
    <h1>一级标题标签</h1>
    <h2>二级标题标签</h2>
    <h3>三级标题标签</h3>
    <h4>四级标题标签</h4>
    <p>段落标签</p>
    <p>更改文本样式：<b>字体加粗</b>、<i>斜体</i>、
        <u>下划线</u>、<s>删除</s></p>
    <p>
    <ul>
        <li>无序列表列表1</li>
        <li>无序列表列表2</li>
    </ul>
    </p>
    <p>
    <ol>
        <li>无序列表列表1</li>
        <li>无序列表列表2</li>
    </ol>
    <h1>table row</h1>
    <table>
        <tr>
            <td>元素1</td>
            <td>元素2</td>
        </tr>
        <tr>
            <td>元素3</td>
        </tr>
    </table>
    </p>
</body>
</html>

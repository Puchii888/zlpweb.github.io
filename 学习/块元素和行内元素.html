<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>块元素和行内元素</title>
</head>
<body>
    <div>
        <a href="#">链接1</a>
        <a href="#">链接2</a>
        <a href="#">链接3</a>
        <a href="#">链接4</a>
    </div>
    <div>
        <h1>文章标题</h1>
        <p>文章内容</p>
        <p>文章内容</p>
    </div>
    <hr>
    <span>这是第一个span标签</span>
    <span>这是第二个span标签</span>
    <span>这是第三个span标签</span>
    <br>
    <span>链接点击这里:<a href="#">链接</a></span>
</body>
</html>
